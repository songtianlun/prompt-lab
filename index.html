<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Lab</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      background: #fff;
      color: #1a1a2e;
      line-height: 1.7;
      font-size: 16px;
      padding: 40px 24px;
      max-width: 760px;
      margin: 0 auto;
    }
    h1 { font-size: 2em; margin: 0 0 16px; }
    h2 { font-size: 1.4em; margin: 28px 0 8px; }
    h3 { font-size: 1.15em; margin: 20px 0 6px; }
    p, li { color: #374151; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
    table { width: 100%; border-collapse: collapse; margin: 16px 0; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e5e7eb; }
    th { font-weight: 600; font-size: 13px; text-transform: uppercase; color: #6b7280; }
    tr:hover td { background: #f9fafb; }
    pre { background: #f3f4f6; padding: 16px; border-radius: 8px; overflow-x: auto; margin: 12px 0; }
    code { font-family: "SF Mono", Consolas, monospace; font-size: 14px; background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
    pre code { background: none; padding: 0; }
    blockquote { border-left: 3px solid #2563eb; padding: 8px 16px; background: #f0f7ff; margin: 12px 0; border-radius: 0 6px 6px 0; }
    hr { border: none; border-top: 1px solid #e5e7eb; margin: 28px 0; }
    ul, ol { padding-left: 24px; margin: 8px 0; }
  </style>
</head>
<body>
  <div id="content">加载中...</div>
  <script>
    const path = location.pathname.replace(/\/$/, '') + '/README.md'
    marked.setOptions({ breaks: true, gfm: true })
    fetch(path)
      .then(r => { if (!r.ok) throw new Error('Not found'); return r.text() })
      .then(md => document.getElementById('content').innerHTML = marked.parse(md))
      .catch(() => document.getElementById('content').innerHTML = '<h1>404</h1><p>页面未找到</p>')
    history.pushState(null, '', location.pathname.replace(/\/$/, '') + '/')
  </script>
</body>
</html>
