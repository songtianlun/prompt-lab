<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Lab</title>
  <style>
    :root {
      --bg-primary: #0a0e17;
      --bg-secondary: #111827;
      --bg-card: #1a1f2e;
      --border: #1f2937;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #f0bb3c;
      --accent-glow: rgba(240, 187, 60, 0.15);
      --accent-dim: rgba(240, 187, 60, 0.08);
      --link: #60a5fa;
      --link-visited: #a78bfa;
      --code-bg: #1a1f2e;
      --quote-border: #f0bb3c;
      --sidebar-bg: rgba(17, 24, 39, 0.85);
      --cover-bg: linear-gradient(135deg, #0a0e17 0%, #1a1f2e 50%, #0f172a 100%);
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", "Helvetica Neue", sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.7;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── sidebar ── */
    .sidebar {
      background: var(--sidebar-bg) !important;
      border-right: 1px solid var(--border) !important;
      backdrop-filter: blur(12px);
      width: 280px !important;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .sidebar ul { padding: 0 16px; }
    .sidebar li { list-style: none; }
    .sidebar li a {
      color: var(--text-secondary) !important;
      font-size: 14px;
      padding: 6px 12px !important;
      border-radius: 6px;
      transition: all 0.15s;
      margin: 1px 0;
    }
    .sidebar li a:hover {
      color: var(--text-primary) !important;
      background: var(--accent-dim);
    }
    .sidebar li a.active {
      color: var(--accent) !important;
      background: var(--accent-dim);
      border-right: 2px solid var(--accent);
    }
    .sidebar ul li ul { padding-left: 12px; }
    .sidebar-nav > ul > li > a {
      font-weight: 600;
      color: var(--text-primary) !important;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .sidebar-nav > ul > li > a:hover { background: transparent !important; }
    .sidebar-nav > ul > li > strong {
      display: block;
      padding: 8px 12px 4px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }
    .sidebar .sidebar-nav li.active > a {
      border-right: none;
    }

    .sidebar-toggle { background: transparent !important; }
    .sidebar-toggle span { background: var(--text-muted) !important; }

    /* ── app name in sidebar ── */
    .app-name {
      text-align: left !important;
      padding: 20px 16px 12px !important;
    }
    .app-name a {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    /* ── content area ── */
    .content {
      padding-top: 0 !important;
    }
    .markdown-section {
      max-width: 820px;
      padding: 40px 60px 80px;
    }
    @media (max-width: 600px) {
      .markdown-section { padding: 20px 24px 60px; }
    }

    .markdown-section h1 {
      font-size: 2.2em;
      font-weight: 800;
      color: var(--text-primary);
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
      margin-top: 0;
      letter-spacing: -0.5px;
    }
    .markdown-section h1:first-child {
      margin-top: 8px;
    }
    .markdown-section h2 {
      font-size: 1.5em;
      font-weight: 700;
      color: var(--text-primary);
      border: none;
      margin-top: 36px;
    }
    .markdown-section h3 {
      font-size: 1.15em;
      font-weight: 600;
      color: var(--text-primary);
    }

    .markdown-section p {
      color: var(--text-secondary);
      margin: 12px 0;
    }

    .markdown-section a {
      color: var(--link);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s;
    }
    .markdown-section a:hover {
      border-bottom-color: var(--link);
    }

    .markdown-section strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    /* ── tables ── */
    .markdown-section table {
      border-collapse: collapse;
      width: 100%;
      margin: 20px 0;
      border-radius: 8px;
      overflow: hidden;
    }
    .markdown-section thead {
      background: var(--bg-card);
    }
    .markdown-section th {
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      padding: 12px 16px;
      text-align: left;
      border: none;
    }
    .markdown-section td {
      padding: 12px 16px;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
    }
    .markdown-section tr:hover td {
      background: var(--accent-dim);
    }
    .markdown-section table tr:last-child td {
      border-bottom: none;
    }

    /* ── code blocks ── */
    .markdown-section pre {
      background: var(--bg-card) !important;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      font-size: 13px;
    }
    .markdown-section code {
      font-family: "JetBrains Mono", "Fira Code", "SF Mono", Consolas, monospace;
      font-size: 13px;
      background: var(--bg-card);
      color: #e2e8f0;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .markdown-section pre code {
      background: transparent;
      padding: 0;
    }

    /* ── blockquote / notes ── */
    .markdown-section blockquote {
      border-left: 3px solid var(--accent);
      background: var(--accent-dim);
      padding: 12px 20px;
      border-radius: 0 8px 8px 0;
      margin: 16px 0;
    }
    .markdown-section blockquote p { color: var(--text-primary); margin: 0; }

    /* ── lists ── */
    .markdown-section ul, .markdown-section ol {
      color: var(--text-secondary);
    }
    .markdown-section li {
      margin: 4px 0;
    }

    /* ── hr ── */
    .markdown-section hr {
      border: none;
      height: 1px;
      background: var(--border);
      margin: 32px 0;
    }

    /* ── scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── cover page ── */
    section.cover {
      background: var(--cover-bg) !important;
      align-items: flex-start !important;
    }
    section.cover .cover-main {
      max-width: 700px;
      margin: 0;
      text-align: left !important;
      padding: 80px 40px;
    }
    section.cover .cover-main h1 {
      font-size: 3em;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      border: none;
      padding: 0;
      letter-spacing: -1px;
    }
    section.cover .cover-main p {
      color: var(--text-secondary);
      font-size: 1.1em;
      line-height: 1.8;
    }
    section.cover .cover-main a {
      color: var(--link);
      border-bottom: none;
    }
    section.cover .cover-main .anchor span { color: var(--text-primary); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script>
    window.$docsify = {
      name: 'Prompt Lab',
      repo: '',
      loadSidebar: true,
      loadNavbar: false,
      auto2top: true,
      search: 'auto',
      subMaxLevel: 3,
      relativePath: true,
      coverpage: true,
      copyCode: {
        buttonText: '复制',
        errorText: '错误',
        successText: '已复制'
      },
    }
  </script>
</body>
</html>
