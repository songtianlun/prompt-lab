<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Lab</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      background: #fff;
      color: #1a1a2e;
      line-height: 1.7;
      font-size: 16px;
      padding: 40px 24px;
      max-width: 760px;
      margin: 0 auto;
    }
    h1 { font-size: 2em; margin: 0 0 16px; }
    h2 { font-size: 1.4em; margin: 28px 0 8px; }
    h3 { font-size: 1.15em; margin: 20px 0 6px; }
    p, li { color: #374151; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
    table { width: 100%; border-collapse: collapse; margin: 16px 0; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e5e7eb; }
    th { font-weight: 600; font-size: 13px; text-transform: uppercase; color: #6b7280; }
    tr:hover td { background: #f9fafb; }
    pre { background: #f3f4f6; padding: 16px; border-radius: 8px; overflow-x: auto; margin: 12px 0; }
    code { font-family: "SF Mono", Consolas, monospace; font-size: 14px; background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
    pre code { background: none; padding: 0; }
    blockquote { border-left: 3px solid #2563eb; padding: 8px 16px; background: #f0f7ff; margin: 12px 0; border-radius: 0 6px 6px 0; }
    hr { border: none; border-top: 1px solid #e5e7eb; margin: 28px 0; }
    ul, ol { padding-left: 24px; margin: 8px 0; }

    #breadcrumb {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 2px 4px;
      font-size: 13px;
      padding-bottom: 20px;
      color: #9ca3af;
    }
    #breadcrumb a {
      color: #6b7280;
      text-decoration: none;
      padding: 2px 6px;
      border-radius: 4px;
      transition: all 0.15s;
      white-space: nowrap;
    }
    #breadcrumb a:hover {
      color: #2563eb;
      background: #f0f7ff;
    }
    #breadcrumb .current {
      color: #111827;
      font-weight: 600;
      white-space: nowrap;
      padding: 2px 6px;
    }
    #breadcrumb .sep {
      color: #d1d5db;
      user-select: none;
      font-size: 14px;
      line-height: 1;
    }

    .empty {
      text-align: center;
      padding: 80px 24px;
    }
    .empty-icon {
      font-size: 48px;
      color: #e5e7eb;
      margin-bottom: 16px;
      line-height: 1;
    }
    .empty h2 {
      font-size: 1.3em;
      font-weight: 600;
      color: #374151;
      margin: 0 0 8px;
      border: none;
    }
    .empty p {
      color: #9ca3af;
      margin: 0 0 24px;
    }
    .empty-link {
      display: inline-block;
      color: #6b7280;
      font-size: 14px;
      padding: 8px 20px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      transition: all 0.15s;
    }
    .empty-link:hover {
      color: #2563eb;
      border-color: #2563eb;
      background: #f0f7ff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="breadcrumb"></div>
  <div id="content">加载中...</div>
  <script>
    function renderBreadcrumb() {
      const s = location.pathname.replace(/\/+$/, '').split('/').filter(Boolean)
      const el = document.getElementById('breadcrumb')
      if (!el) return
      if (s.length <= 1) { el.style.display = 'none'; return }
      el.style.display = ''
      let html = `<a href="/${s[0]}/" class="home">首页</a>`
      let p = '/' + s[0]
      for (let i = 1; i < s.length; i++) {
        p += '/' + s[i]
        html += '<span class="sep">›</span>'
        if (i === s.length - 1) {
          html += `<span class="current">${s[i]}</span>`
        } else {
          html += `<a href="${p}/">${s[i]}</a>`
        }
      }
      el.innerHTML = html
    }
    renderBreadcrumb()
    marked.setOptions({ breaks: true, gfm: true })
    const root = '/' + location.pathname.replace(/\/+$/, '').split('/').filter(Boolean)[0] + '/'
    const path = location.pathname.replace(/\/?$/, '/README.md')
    fetch(path)
      .then(r => { if (!r.ok) throw new Error('Not found'); return r.text() })
      .then(md => document.getElementById('content').innerHTML = marked.parse(md.replace(/^---[\s\S]*?---\s*/, '')))
      .catch(() => {
        document.getElementById('breadcrumb').style.display = 'none'
        document.getElementById('content').innerHTML = '<div class="empty"><div class="empty-icon">◌</div><h2>该目录暂无内容</h2><p>这个目录下还没有 README 文件。</p><a href="' + root + '" class="empty-link">← 返回首页</a></div>'
      })
  </script>
</body>
</html>
